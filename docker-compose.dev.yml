services:
  postgres:
    image: postgres:16-alpine
    container_name: guitar-app-postgres-dev
    environment:
      POSTGRES_USER: guitar
      POSTGRES_PASSWORD: guitar_dev
      POSTGRES_DB: guitar
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - guitar_pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U guitar -d guitar']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  guitar_pg_dev:
