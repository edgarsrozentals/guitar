# IdeaJetLab - Project Style Profile
# Generated by Pixel on 2024-12-15
# Theme: "Obsidian Ember" (Dark) / "Ember Glow" (Light)

project:
  name: IdeaJetLab
  tagline: "Ship your SaaS MVP in record time"
  domain: SaaS MVP Development Agency
  personality: Energetic / Bold / Warm / Tech-Forward

colors:
  # Primary Accent
  accent: "#ff6b35"
  accent_hover: "#ff8c42"
  accent_subtle: "rgba(255, 107, 53, 0.1)"
  accent_rgb: "255, 107, 53"

  # Dark Theme (Default - "Obsidian Ember")
  dark:
    background: "#0c0a08"
    background_alt: "#0D0D0D"
    surface: "#161310"
    surface_hover: "#1e1a16"
    border: "#2e2820"
    border_subtle: "rgba(255, 255, 255, 0.05)"
    text_primary: "#ffffff"
    text_secondary: "#b0a090"
    text_muted: "#706050"
    card_bg: "#1A1A1A"

  # Light Theme ("Ember Glow")
  light:
    background: "#F5F3EF"
    background_alt: "#EDE8E2"
    surface: "#FFFFFF"
    surface_hover: "#F5F0EB"
    border: "#E5DED5"
    border_subtle: "#EDE8E2"
    text_primary: "#1C1917"
    text_secondary: "#57534E"
    text_muted: "#78716C"
    card_bg: "#FFFFFF"

  # Status Colors
  success: "#00cc88"
  warning: "#ffcc00"
  error: "#ff4466"

typography:
  font_family: "Inter"
  font_weights: [300, 400, 500, 600]
  scale:
    h1: "clamp(2rem, 5vw, 3rem)"
    h2: "clamp(1.5rem, 4vw, 2.25rem)"
    h3: "clamp(1.125rem, 2vw, 1.25rem)"
    body: "0.875rem"
    body_lg: "1rem"
    small: "0.75rem"

visual_patterns:
  # Border Radius
  border_radius:
    card: "1rem"  # rounded-2xl
    button: "9999px"  # rounded-full (pill shape)
    small: "0.5rem"

  # Shadows & Glows
  shadows:
    glow: "0 0 20px -5px #ff6b35"
    glow_strong: "0 0 30px -5px #ff6b35"
    glow_card: "0 0 50px -20px rgba(255, 107, 53, 0.15)"

  # Effects
  effects:
    - name: "Interactive Glow"
      description: "Radial gradient follows cursor on hover"
      gradient: "radial-gradient(600px circle at cursor, rgba(255,107,53,0.15), transparent 40%)"

    - name: "Gradient Text"
      description: "Animated gradient sweep through text"
      colors: ["gradient-start", "accent"]
      animation: "11s linear infinite alternate"

  # Gradients
  gradients:
    glow_overlay: "rgba(255, 107, 53, 0.1)"
    subtle_overlay: "rgba(255, 107, 53, 0.05)"

image_style:
  # Based on existing assets analysis
  primary_style: "3D Isometric Illustration"
  characteristics:
    - "Tech-forward, futuristic aesthetic"
    - "Glass/transparent UI elements"
    - "Copper/orange accent glows and lines"
    - "Dark backgrounds for hero images"
    - "Dimensional, glossy finishes"
    - "Connected platform/network visual metaphors"
    - "Professional business context with innovation"

  color_palette:
    primary: "#ff6b35"  # Warm ember orange
    secondary: "#ff8c42"  # Lighter orange
    glow: "rgba(255, 107, 53, 0.5)"  # Orange glow
    background: "#0c0a08"  # Near-black with warm undertone
    metallic: "#b0a090"  # Warm copper/bronze for metallic elements

  mood_keywords:
    - "innovative"
    - "professional"
    - "energetic"
    - "tech-forward"
    - "warm"
    - "bold"
    - "futuristic"
    - "connected"

  avoid:
    - "Cold blue tech cliches"
    - "Generic stock photo style"
    - "Flat 2D illustrations"
    - "Overly corporate sterile"
    - "Neon/cyberpunk extremes"

existing_assets:
  - path: "/public/assets/logo.png"
    description: "3D glossy orange rocket in rounded square frame"
    style: "Dimensional, brand orange, launch/innovation symbolism"

  - path: "/public/assets/consultancy-hero-ai.png"
    description: "Isometric 3D scene - business person with tech dashboard"
    style: "Glass effects, copper/orange glows, connected platforms"

  - path: "/public/assets/consultancy-hero-3d.jpg"
    description: "3D hero image for consultancy page"
    style: "Matches brand aesthetic"

recommended_output:
  folder: "public/images/generated"
  format: "png"
  resolution: "1K"
  naming: "{description}-{section}-v{version}.png"

generation_guidelines:
  always_include:
    - "Warm orange accent color #ff6b35"
    - "Dark background for contrast"
    - "3D or isometric perspective"
    - "Glass/transparent elements"
    - "Professional tech context"

  prompt_prefix: |
    Create a 3D isometric illustration with a tech-forward, futuristic aesthetic.
    Use warm orange (#ff6b35) as the accent color against dark backgrounds.
    Include glass/transparent UI elements and dimensional copper/orange glows.
    Style should be professional yet innovative, avoiding cold blue tech cliches.
